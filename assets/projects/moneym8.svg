<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="mmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141929"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#mmGrad)"/>
  <rect x="0" y="0" width="600" height="44" rx="16" fill="#141929"/>
  <rect x="0" y="24" width="600" height="20" fill="#141929"/>
  <circle cx="30" cy="22" r="6" fill="#ef4444"/>
  <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#10b981"/>
  <text x="300" y="27" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MoneyM8 · Personal Expense Tracker &amp; Cross-Device Sync</text>

  <!-- PWA Card -->
  <g transform="translate(35, 65)">
    <rect width="250" height="120" rx="12" fill="#1c2338" stroke="#2e3a55" stroke-width="1.5"/>
    <text x="20" y="32" fill="#8b96b3" font-family="sans-serif" font-size="11">Monthly Budget Status</text>
    <text x="20" y="65" fill="#e8edf8" font-family="sans-serif" font-size="24" font-weight="bold">₹ 14,250</text>
    <text x="125" y="65" fill="#4ade80" font-family="sans-serif" font-size="12">/ ₹ 20,000</text>
    <!-- Progress bar -->
    <rect x="20" y="85" width="210" height="8" rx="4" fill="#0f1424"/>
    <rect x="20" y="85" width="150" height="8" rx="4" fill="#4f46e5"/>
  </g>

  <g transform="translate(315, 65)">
    <rect width="250" height="120" rx="12" fill="#1c2338" stroke="#2e3a55" stroke-width="1.5"/>
    <text x="20" y="32" fill="#8b96b3" font-family="sans-serif" font-size="11">PWA Capabilities</text>
    <text x="20" y="58" fill="#38bdf8" font-family="sans-serif" font-size="12">✓ Progressive Web App (Offline)</text>
    <text x="20" y="78" fill="#38bdf8" font-family="sans-serif" font-size="12">✓ Encrypted Device-to-Device Sync</text>
    <text x="20" y="98" fill="#38bdf8" font-family="sans-serif" font-size="12">✓ Zero Tracking / 100% Private</text>
  </g>

  <!-- Recent Expenses Table -->
  <g transform="translate(35, 205)">
    <rect width="530" height="125" rx="10" fill="#0f1424" stroke="#242b42" stroke-width="1.5"/>
    <text x="20" y="30" fill="#8b96b3" font-family="sans-serif" font-size="12" font-weight="bold">Recent Transactions</text>
    <!-- Row 1 -->
    <text x="20" y="60" fill="#e8edf8" font-family="sans-serif" font-size="12">College Semester Textbooks</text>
    <text x="350" y="60" fill="#8b96b3" font-family="sans-serif" font-size="12">Education</text>
    <text x="470" y="60" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">- ₹ 1,200</text>
    <!-- Row 2 -->
    <line x1="15" y1="74" x2="515" y2="74" stroke="#1c2338"/>
    <text x="20" y="98" fill="#e8edf8" font-family="sans-serif" font-size="12">Hostel WiFi &amp; Server Hosting</text>
    <text x="350" y="98" fill="#8b96b3" font-family="sans-serif" font-size="12">Utilities</text>
    <text x="470" y="98" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">- ₹ 650</text>
  </g>
