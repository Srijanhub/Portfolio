<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#tgGrad)"/>
  <rect x="0" y="0" width="600" height="44" rx="16" fill="#065f46"/>
  <rect x="0" y="24" width="600" height="20" fill="#065f46"/>
  <circle cx="30" cy="22" r="6" fill="#ef4444"/>
  <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#10b981"/>
  <text x="300" y="27" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TouchGrass 🌱 · Weather &amp; Outing Recommendation Engine</text>

  <!-- Weather & Outing Card -->
  <g transform="translate(40, 65)">
    <rect width="520" height="110" rx="12" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="38" fill="#d1fae5" font-family="sans-serif" font-size="14" font-weight="bold">Current Weather: 24°C · Clear Sky ☀️</text>
    <text x="25" y="65" fill="#ecfdf5" font-family="sans-serif" font-size="18" font-weight="bold">Suggested Outing: Walk in Central Botanical Garden</text>
    <text x="25" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="12">1.2 km away · Quiet &amp; Scenic · High Air Quality Index (AQI 42)</text>
    <rect x="420" y="25" width="80" height="60" rx="8" fill="#064e3b"/>
    <text x="460" y="52" fill="#34d399" font-family="sans-serif" font-size="18" text-anchor="middle">🌳</text>
    <text x="460" y="72" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">100% Outdoor</text>
  </g>

  <!-- Map and Places Data Row -->
  <g transform="translate(40, 190)">
    <rect width="250" height="135" rx="10" fill="#022c22" stroke="#065f46" stroke-width="1.5"/>
    <text x="20" y="28" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">OpenStreetMap &amp; Overpass API</text>
    <line x1="20" y1="40" x2="230" y2="40" stroke="#047857"/>
    <text x="20" y="62" fill="#d1fae5" font-family="sans-serif" font-size="11">📍 Botanical Garden (1.2 km)</text>
    <text x="20" y="84" fill="#a7f3d0" font-family="sans-serif" font-size="11">📍 Lakeside Trail (2.4 km)</text>
    <text x="20" y="106" fill="#a7f3d0" font-family="sans-serif" font-size="11">📍 Sunset Hill Lookout (3.1 km)</text>
  </g>

  <g transform="translate(310, 190)">
    <rect width="250" height="135" rx="10" fill="#022c22" stroke="#065f46" stroke-width="1.5"/>
    <text x="20" y="28" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">Architecture Highlights</text>
    <line x1="20" y1="40" x2="230" y2="40" stroke="#047857"/>
    <text x="20" y="62" fill="#d1fae5" font-family="sans-serif" font-size="11">⚡ Zero API Key Dependency</text>
    <text x="20" y="84" fill="#a7f3d0" font-family="sans-serif" font-size="11">⚡ Vercel Edge Serverless Proxy</text>
    <text x="20" y="106" fill="#a7f3d0" font-family="sans-serif" font-size="11">⚡ 100% Client-Side Privacy</text>
  </g>
</svg>