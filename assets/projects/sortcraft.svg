<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#p2Grad)"/>
  <rect x="0" y="0" width="600" height="44" rx="16" fill="#1f2937"/>
  <rect x="0" y="24" width="600" height="20" fill="#1f2937"/>
  <circle cx="30" cy="22" r="6" fill="#ef4444"/>
  <circle cx="50" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#10b981"/>
  <text x="300" y="27" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SortCraft · Algorithm Complexity Visualizer</text>
  
  <!-- Control bar -->
  <g transform="translate(35, 60)">
    <rect width="530" height="42" rx="8" fill="#374151"/>
    <rect x="15" y="8" width="85" height="26" rx="6" fill="#4f46e5"/>
    <text x="57" y="25" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bubble Sort</text>
    <rect x="110" y="8" width="95" height="26" rx="6" fill="#1f2937"/>
    <text x="157" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">Quick Sort</text>
    <rect x="215" y="8" width="85" height="26" rx="6" fill="#1f2937"/>
    <text x="257" y="25" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="middle">Merge Sort</text>
    <!-- Speed indicator -->
    <text x="430" y="26" fill="#d1d5db" font-family="sans-serif" font-size="12">Speed: 1.5x</text>
    <circle cx="505" cy="21" r="9" fill="#10b981"/>
    <polygon points="502,17 502,25 510,21" fill="#fff"/>
  </g>

  <!-- Sorting Bars Visualizer -->
  <g transform="translate(50, 310)">
    <!-- Base line -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="#4b5563" stroke-width="2"/>
    <!-- Bars (x, height, color) -->
    <rect x="10" y="-45" width="22" height="45" rx="4" fill="#60a5fa"/>
    <rect x="42" y="-110" width="22" height="110" rx="4" fill="#60a5fa"/>
    <rect x="74" y="-75" width="22" height="75" rx="4" fill="#60a5fa"/>
    <rect x="106" y="-165" width="22" height="165" rx="4" fill="#f87171"/>
    <rect x="138" y="-135" width="22" height="135" rx="4" fill="#facc15"/>
    <rect x="170" y="-85" width="22" height="85" rx="4" fill="#60a5fa"/>
    <rect x="202" y="-195" width="22" height="195" rx="4" fill="#60a5fa"/>
    <rect x="234" y="-120" width="22" height="120" rx="4" fill="#34d399"/>
    <rect x="266" y="-140" width="22" height="140" rx="4" fill="#34d399"/>
    <rect x="298" y="-90" width="22" height="90" rx="4" fill="#60a5fa"/>
    <rect x="330" y="-55" width="22" height="55" rx="4" fill="#60a5fa"/>
    <rect x="362" y="-150" width="22" height="150" rx="4" fill="#60a5fa"/>
    <rect x="394" y="-175" width="22" height="175" rx="4" fill="#34d399"/>
    <rect x="426" y="-185" width="22" height="185" rx="4" fill="#34d399"/>
    <rect x="458" y="-200" width="22" height="200" rx="4" fill="#34d399"/>
  </g>
  
  <text x="240" y="145" fill="#fbbf24" font-family="monospace" font-size="12">Comparing: arr[3] &gt; arr[4]</text>
  <text x="240" y="165" fill="#9ca3af" font-family="monospace" font-size="11">Time Complexity: O(n²) | Space: O(1)</text>
</svg>