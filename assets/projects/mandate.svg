    <rect x="410" y="30" width="125" height="70" rx="10" fill="#003087" stroke="#0079c1" stroke-width="1.5"/>
    <text x="472" y="60" fill="#bae6fd" font-family="sans-serif" font-size="11" text-anchor="middle">Settlement Rails</text>
    <text x="472" y="82" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PayPal Orders v2</text>
  </g>

  <!-- Cryptographic Audit Ledger Terminal Preview -->
  <g transform="translate(35, 210)">
    <rect width="530" height="115" rx="10" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-family="monospace" font-size="12">audit_ledger &gt; SHA-256 Hash Chaining Active</text>
    <text x="20" y="52" fill="#9ca3af" font-family="monospace" font-size="11">[C4_DECISION] Case #4891: Approved · Price: $48.50 · Merchant Verified</text>
    <text x="20" y="74" fill="#34d399" font-family="monospace" font-size="11">[INTENT_RECEIPT] 8f9b4c1e7a... · Fail-closed deterministic guard passed</text>
    <text x="20" y="96" fill="#e5e7eb" font-family="monospace" font-size="11">[SETTLED] PayPal Order: 7XY2901844 · Status: COMPLETED</text>
