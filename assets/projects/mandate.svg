    <!-- Mandate Firewall (Center) -->
    <rect x="190" y="10" width="160" height="110" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
    <rect x="200" y="22" width="140" height="24" rx="6" fill="#4338ca"/>
    <text x="270" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MANDATE POLICY CORE</text>
    <text x="210" y="65" fill="#a5b4fc" font-family="monospace" font-size="11">✓ Budget: &lt; $60</text>
    <text x="210" y="83" fill="#a5b4fc" font-family="monospace" font-size="11">✓ Sanitized HTML</text>
    <text x="210" y="101" fill="#34d399" font-family="monospace" font-size="11">✓ Intent Receipt</text>

    <!-- Arrow 2 -->
